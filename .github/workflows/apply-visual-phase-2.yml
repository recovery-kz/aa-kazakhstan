name: Apply visual phase 2

on:
  push:
    paths:
      - 'scripts/apply-visual-phase-2.py'
      - '.github/workflows/apply-visual-phase-2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python scripts/apply-visual-phase-2.py
      - name: Validate files
        run: |
          python -m py_compile scripts/apply-visual-phase-2.py
          grep -q 'class="nav-icon"' index.html
          grep -q "aa-kaz-v6" sw.js
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Apply visual language phase 2"
          git push
