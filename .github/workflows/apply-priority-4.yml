name: Apply priority 4

on:
  push:
    paths:
      - 'scripts/apply-priority-4.py'
      - '.github/workflows/apply-priority-4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python scripts/apply-priority-4.py
      - name: Validate files
        run: |
          python -m py_compile scripts/apply-priority-4.py
          grep -q 'aa_first_run_done_v1' index.html
          grep -q 'Сообщить об ошибке' index.html
          grep -q 'schedule-updated-value' index.html
          grep -q "aa-kaz-v8" sw.js
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Apply trust and feedback priority 4"
          git push
