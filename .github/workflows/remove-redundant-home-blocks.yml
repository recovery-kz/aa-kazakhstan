name: Simplify home screen

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'remove-home-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply migration
        run: |
          git show origin/main:scripts/remove_redundant_home_blocks.py > /tmp/remove_redundant_home_blocks.py
          python3 /tmp/remove_redundant_home_blocks.py
      - name: Validate
        run: |
          grep -q 'data-today-action="today"' index.html
          grep -q 'data-today-action="favorites"' index.html
          ! grep -q 'data-today-action="call"' index.html
          ! grep -q 'data-today-action="first"' index.html
          ! grep -q 'id="nearest-meeting-card"' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Simplify home screen actions"
          git push origin HEAD:${{ github.head_ref }}
