name: Update visible version 2.0

on:
  push:
    paths:
      - 'scripts/update-visible-version-2.py'
      - '.github/workflows/update-visible-version-2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update-visible-version-2.py
      - run: |
          grep -q 'settings-version-value">2.0<' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update visible app version to 2.0"
          git push
