name: Fix notification UI

on:
  push:
    branches: [main]
    paths:
      - 'notification-ui-fix-trigger-v2.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply notification UI fix
        run: python3 scripts/fix_notification_ui.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix notification labels and header layout"
          git push origin main
