name: Apply settings cleanup

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'settings-cleanup-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply migration
        run: |
          git show origin/main:scripts/apply_settings_cleanup.py > /tmp/apply_settings_cleanup.py
          python3 /tmp/apply_settings_cleanup.py
      - name: Validate
        run: |
          grep -q 'id="acc-settings"' index.html
          grep -q 'id="first-time-modal"' index.html
          grep -q "city-setting-open').addEventListener" index.html
          ! grep -q 'alert(`${d.firstTitle}' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Group settings and replace browser alert"
          git push origin HEAD:${{ github.head_ref }}
