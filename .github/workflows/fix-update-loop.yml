name: Fix update loop

on:
  push:
    paths:
      - 'scripts/fix-update-loop.py'
      - '.github/workflows/fix-update-loop.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hotfix
        run: python scripts/fix-update-loop.py
      - name: Validate
        run: |
          node --check app.js
          node --check sw.js
          grep -q "aa-kaz-v12" sw.js
          ! grep -A20 "async function forceUpdate" app.js | grep -q "location.reload"
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js version.json
          git diff --cached --quiet || git commit -m "Stop automatic update reload loop"
          git push
