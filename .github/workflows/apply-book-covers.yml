name: Apply book covers

on:
  push:
    paths:
      - 'scripts/apply-book-covers.py'
      - '.github/workflows/apply-book-covers.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply covers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/apply-book-covers.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate JSON and assets
        run: |
          python -m json.tool books.json >/dev/null
          test "$(find book-covers -name '*.webp' | wc -l)" -eq 15
          grep -q 'app.js?v=2.0.3' index.html
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css books.json index.html book-covers
          git diff --cached --quiet || git commit -m "Add real book covers to library"
          git push
