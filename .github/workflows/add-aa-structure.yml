name: Add AA structure section

on:
  pull_request:
    paths:
      - 'scripts/add-aa-structure.py'
      - '.github/workflows/add-aa-structure.yml'
      - 'assets/aa-kazakhstan-structure.svg'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add section
        run: python scripts/add-aa-structure.py
      - name: Validate
        run: |
          node --check app.js
          grep -q 'id="acc-aa-structure"' index.html
          test "$(grep -o 'class="committee-item"' index.html | wc -l)" -eq 11
          grep -q 'styles.css?v=2.0.4' index.html
          test -s assets/aa-kazakhstan-structure.svg
      - name: Commit result to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css assets/aa-kazakhstan-structure.svg
          git diff --cached --quiet || git commit -m "Add AA Kazakhstan structure section"
          git push origin HEAD:${{ github.head_ref }}
