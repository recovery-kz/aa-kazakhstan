name: Add release 2 notification

on:
  push:
    paths:
      - 'scripts/add-release-2-notification.py'
      - '.github/workflows/add-release-2-notification.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/add-release-2-notification.py
      - run: node --check app.js
      - run: python -m json.tool news.json >/dev/null
      - run: |
          grep -q "release:2.0" app.js
          grep -q "release-2-0-ru" news.json
          grep -q "app.js?v=2.0.2" index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git diff --cached --quiet || git commit -m "Add version 2.0 release notification"
          git push
