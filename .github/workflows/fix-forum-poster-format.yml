name: Fix forum poster format

on:
  pull_request:
    paths:
      - 'scripts/fix-forum-poster-format.py'
      - '.github/workflows/fix-forum-poster-format.yml'
      - 'news/2026-07-31-almaty-forum-4/original-poster.jpg'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/fix-forum-poster-format.py
      - name: Verify JPEG signature
        run: python - <<'PY'
from pathlib import Path
p=Path('news/2026-07-31-almaty-forum-4/original-poster.jpg')
data=p.read_bytes()
assert data.startswith(b'\xff\xd8\xff'), data[:12]
print('JPEG verified', len(data))
PY
      - name: Commit converted image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/2026-07-31-almaty-forum-4/original-poster.jpg
          git diff --cached --quiet || git commit -m "Convert forum poster to real JPEG"
          git push origin HEAD:${{ github.head_ref }}
