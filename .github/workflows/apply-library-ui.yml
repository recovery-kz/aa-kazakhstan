name: Apply library UI update

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'library-ui-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply library interface
        run: |
          git show origin/main:scripts/apply_library_ui.py > /tmp/apply_library_ui.py
          python3 /tmp/apply_library_ui.py

      - name: Commit changes to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Redesign literature library"
          git push origin HEAD:${{ github.head_ref }}
