name: Emergency disable service worker

on:
  push:
    paths:
      - 'scripts/emergency-disable-sw.py'
      - '.github/workflows/emergency-disable-sw.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply emergency fix
        run: python scripts/emergency-disable-sw.py
      - name: Validate
        run: |
          node --check app.js
          node --check sw.js
          grep -q 'window.__AA_DISABLE_SERVICE_WORKER__' index.html
          grep -q 'app.js?v=2.0.1' index.html
          ! grep -q "register('sw.js" app.js
          ! grep -q 'controllerchange' app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js sw.js
          git diff --cached --quiet || git commit -m "Emergency disable service worker reload loop"
          git push
