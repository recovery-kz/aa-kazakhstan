name: Apply internal notifications

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'internal-notifications-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply internal notifications migration
        run: |
          git show origin/main:scripts/apply_internal_notifications.py > /tmp/apply_internal_notifications.py
          python3 /tmp/apply_internal_notifications.py

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add internal notification center"
          git push origin HEAD:${{ github.head_ref }}
