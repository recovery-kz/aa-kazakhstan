name: Apply priority 3

on:
  push:
    paths:
      - 'scripts/apply-priority-3.py'
      - '.github/workflows/apply-priority-3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python scripts/apply-priority-3.py
      - name: Validate files
        run: |
          python -m py_compile scripts/apply-priority-3.py
          grep -q 'class="text-size-setting"' index.html
          grep -q 'class="group-actions"' index.html
          grep -q 'id="app-status"' index.html
          grep -q "aa-kaz-v7" sw.js
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Apply accessibility priority 3"
          git push
