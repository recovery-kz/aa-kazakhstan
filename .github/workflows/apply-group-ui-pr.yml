name: Apply group UI update from PR

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'group-ui-pr-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Run stored update script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-group-ui.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit changes"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, 'group-ui-update', 'exec'))
          PY

      - name: Commit changes to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Unify group cards and add favorites"
          git push origin HEAD:${{ github.head_ref }}
