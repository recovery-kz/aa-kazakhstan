name: Apply group UI update from PR

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'group-ui-pr-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Run robust migration script
        run: |
          git show origin/main:scripts/apply_group_ui.py > /tmp/apply_group_ui.py
          python3 /tmp/apply_group_ui.py

      - name: Commit changes to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Unify group cards and add favorites"
          git push origin HEAD:${{ github.head_ref }}
