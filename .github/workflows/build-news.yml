name: Build news feed

"on":
  push:
    paths:
      - "news/**"
      - "scripts/build_news.py"
      - ".github/workflows/build-news.yml"

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-news:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build news.json
        run: python scripts/build_news.py

      - name: Save news.json
        run: |
          if git diff --quiet -- news.json; then
            echo "news.json не изменился"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json
          git commit -m "Обновить ленту новостей"
          git push
