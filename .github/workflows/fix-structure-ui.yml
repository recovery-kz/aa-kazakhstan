name: Fix structure UI

on:
  push:
    paths:
      - 'scripts/fix-structure-ui.py'
      - '.github/workflows/fix-structure-ui.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python scripts/fix-structure-ui.py
      - name: Validate
        run: |
          node --check app.js
          grep -q 'structure-image-modal' index.html
          grep -q 'styles.css?v=2.0.4' index.html
          grep -q 'app.js?v=2.0.4' index.html
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css
          git diff --cached --quiet || git commit -m "Fix structure image and committee accordions"
          git push
