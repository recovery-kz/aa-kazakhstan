name: Apply automatic app update

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'auto-update-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply automatic update migration
        run: |
          git show origin/main:scripts/apply_auto_update.py > /tmp/apply_auto_update.py
          python3 /tmp/apply_auto_update.py
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable automatic app updates on launch"
          git push origin HEAD:${{ github.head_ref }}
