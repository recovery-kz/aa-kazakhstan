name: Normalize group cards

on:
  push:
    paths:
      - '.github/workflows/normalize-group-cards.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize group names and card styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          before_count = len(re.findall(r"\{c:'", text))

          replacements = {
              "АА «ШАГ ЗА ШАГОМ»": "АА «Шаг за шагом»",
              "АА «8 марта»": "АА «8 Марта»",
              "АА «АлмА» (женская)": "АА «Алма» (женская)",
              "АА «НОВЫЕ ОЧКИ»": "АА «Новые очки»",
              "АА «боралдай»": "АА «Боралдай»",
              "АА «большая перемена»": "АА «Большая перемена»",
              "АА «ПУТЬ»": "АА «Путь»",
              "АА «ВОЗРОЖДЕНИЕ»": "АА «Возрождение»",
              "АА «гармония»": "АА «Гармония»",
              "АА «үміт» (каз)": "АА «Үміт» (каз)",
              "АА «ОАЗИС»": "АА «Оазис»",
              "АА «НАЧАЛО»": "АА «Начало»",
              "АА «решение есть»": "АА «Решение есть»",
              "АА «НАДЕЖДА»": "АА «Надежда»",
              "АА «ДОСТАР»": "АА «Достар»",
              "АА «СЕМЁРОЧКА»": "АА «Семёрочка»",
              "АА «жетысу»": "АА «Жетысу»",
              "АА «УСТЬЕ»": "АА «Устье»",
              "АА «сырдарья»": "АА «Сырдарья»",
              "АА «СВОБОДА»": "АА «Свобода»",
              "АА «ПАНА» (каз)": "АА «Пана» (каз)",
              "АА «Чистое Небо»": "АА «Чистое небо»",
              "АА «куат»": "АА «Куат»",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected group name: {old}')
              text = text.replace(old, new, 1)

          old_css = """        .group-card { border-left: 6px solid var(--primary); padding: 15px; text-align: left; }
        .status-badge { font-size: 10px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .s-open { color: var(--open); } .s-open .status-dot { background: var(--open); }
        .s-soon { color: var(--soon); } .s-soon .status-dot { background: var(--soon); }
        .s-closed { color: var(--closed); } .s-closed .status-dot { background: var(--closed); }

        .group-name { font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; line-height: 1.3; }
        .city-tag { font-size: 11px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
        .group-icons { font-size: 14px; margin-left: 6px; }
        .info-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; font-size: 13px; line-height: 1.45; color: var(--text-main); }
        .info-row-icon { width: 18px; flex-shrink: 0; text-align: center; color: var(--accent); }
        .group-phones { display: flex; flex-direction: column; gap: 6px; }
        .phone-link, .inline-link { color: var(--link); text-decoration: none; font-weight: 700; }
        .muted { color: var(--text-sub); }
"""

          new_css = """        .group-card {
            position: relative;
            padding: 18px;
            text-align: left;
            border: 1px solid var(--border);
            box-shadow: 0 3px 14px rgba(0,0,0,0.045);
        }

        .group-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 18px;
            right: 18px;
            height: 3px;
            border-radius: 0 0 3px 3px;
            background: var(--primary);
            opacity: 0.9;
        }

        .status-badge {
            display: flex;
            align-items: center;
            margin: 3px 0 5px;
            font-size: 9px;
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: 0.055em;
            text-transform: uppercase;
        }

        .status-dot { width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; flex-shrink: 0; }
        .s-open { color: var(--open); } .s-open .status-dot { background: var(--open); }
        .s-soon { color: var(--soon); } .s-soon .status-dot { background: var(--soon); }
        .s-closed { color: var(--closed); } .s-closed .status-dot { background: var(--closed); }

        .city-tag {
            margin-bottom: 5px;
            color: var(--text-sub);
            font-size: 10px;
            line-height: 1.2;
            font-weight: 750;
            letter-spacing: 0.07em;
            text-transform: uppercase;
        }

        .group-name {
            margin-bottom: 12px;
            color: var(--text-main);
            font-size: 18px;
            line-height: 1.28;
            font-weight: 780;
            letter-spacing: -0.015em;
        }

        .group-icons { margin-left: 5px; font-size: 13px; letter-spacing: 0; white-space: nowrap; }

        .info-row {
            display: flex;
            gap: 11px;
            align-items: flex-start;
            padding: 9px 0;
            margin: 0;
            border-top: 1px solid var(--border);
            color: var(--text-main);
            font-size: 13px;
            line-height: 1.48;
        }

        .info-row-icon {
            width: 19px;
            padding-top: 1px;
            flex-shrink: 0;
            color: var(--accent);
            text-align: center;
            font-size: 14px;
        }

        .info-row > div { min-width: 0; flex: 1; }

        .muted {
            margin-bottom: 3px;
            color: var(--text-sub);
            font-size: 9px;
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: 0.065em;
            text-transform: uppercase;
        }

        .group-phones { display: flex; flex-wrap: wrap; gap: 6px 10px; }
        .phone-link, .inline-link { color: var(--link); text-decoration: none; font-weight: 720; }
        .phone-link { display: inline-flex; align-items: center; min-height: 28px; }
        .inline-link { display: inline-block; margin-top: 3px; font-size: 12px; }
"""

          if old_css not in text:
              raise SystemExit('Expected group CSS block not found')
          text = text.replace(old_css, new_css, 1)

          after_count = len(re.findall(r"\{c:'", text))
          if before_count != after_count or before_count != 43:
              raise SystemExit(f'Group count changed: {before_count} -> {after_count}')

          for marker in ["АА «Пробуждение»", "АА «Друзья Билла»", "АА «Венера»", "АА «Жетысу»", "АА «Сырдарья»"]:
              if marker not in text:
                  raise SystemExit(f'Control group missing: {marker}')

          path.write_text(text, encoding='utf-8')
          print(f'Validated {after_count} groups; styling and capitalization normalized.')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Normalize group names and card layout"
          git push
